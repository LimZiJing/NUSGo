name: deploy-frontend-production

run-name: Production frontend release ${{ inputs.release_id }}

# Manual only. Select the commit to promote in the workflow-dispatch ref selector.
# Deploy the backend first when the commit also changes the API.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: ID of the reviewed notes in frontend/releases (YYYY-MM-DD.N)
        required: true
        type: string

# Read deployment history so a completed promotion reserves its ID while publication retries.
permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the production frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to gate each deploy behind a manual approval.
    environment:
      name: frontend-production
    steps:
      - name: Checkout selected workflow ref
        uses: actions/checkout@v4
        with:
          # The dispatch ref is the selected deployment commit and the run's head SHA.
          # The data version is the last commit that changed the data contract, so it needs history.
          fetch-depth: 0

      # Computed from the checked-out ref; github.sha is the commit the workflow was started on.
      - name: Resolve data version
        id: data-version
        run: echo "version=$(bash scripts/data-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare validated release history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES_PATH: frontend/releases/${{ inputs.release_id }}.json
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_HISTORY_OUTPUT: frontend/public/releases/index.json
        run: |
          if ! [[ "$RELEASE_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "Invalid release ID: $RELEASE_ID" >&2
            exit 1
          fi
          node scripts/release-history.mjs

      - name: Build
        env:
          VITE_API_ORIGIN: ${{ vars.NUSGO_API_ORIGIN || 'https://api.example.invalid' }}
          VITE_DATA_VERSION: ${{ steps.data-version.outputs.version }}
          VITE_RELEASE_SHA: ${{ github.sha }}
          # Cloudflare Pages serves from the domain root, not /NUSGo/.
          VITE_BASE_PATH: /
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-message="NUSGo production run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
