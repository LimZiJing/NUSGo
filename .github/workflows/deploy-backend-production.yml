name: deploy-backend-production

on:
  push:
    branches:
      - main
    # Only files the backend image or the deploy script actually use. The Dockerfile copies the
    # frontend data files and the shuttle timing script, so those count as backend inputs too.
    paths:
      - backend/**
      - shared/**
      - frontend/public/data/**
      - scripts/generate-shuttle-timing.mjs
      - scripts/deploy-prod.sh
      - scripts/data-version.sh
      - docker-compose.prod.yml
      - deploy/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-backend-production.yml
  workflow_dispatch:

permissions:
  contents: read

# Deploys never overlap or cancel one another, so a half-finished deploy is not interrupted.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  checks:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    name: Deploy to the production server
    needs: checks
    runs-on: ubuntu-latest
    # The dev frontend also calls this backend, so keep required reviewers on this environment
    # to gate each deploy behind a manual approval.
    environment: backend-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $DEPLOY_SHA" < scripts/deploy-prod.sh
