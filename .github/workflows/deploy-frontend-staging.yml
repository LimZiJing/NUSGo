name: deploy-frontend-staging

# Every update to main, including a merge, refreshes the Cloudflare Pages staging branch.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-frontend-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the staging frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    environment:
      name: frontend-staging
      url: https://staging.${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The data version is the last commit that changed the data contract.
          fetch-depth: 0

      - name: Resolve data version
        id: data-version
        run: echo "version=$(bash scripts/data-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_API_ORIGIN: ${{ vars.NUSGO_API_ORIGIN || 'https://api.example.invalid' }}
          VITE_BASE_PATH: /
          VITE_DATA_VERSION: ${{ steps.data-version.outputs.version }}
          VITE_PWA_ORIGIN: https://staging.${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev
          VITE_RELEASE_SHA: ${{ github.sha }}
        run: npm run build

      - name: Deploy staging branch to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=staging --commit-hash=${{ github.sha }} --commit-message="NUSGo staging run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
