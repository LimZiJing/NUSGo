name: development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-development
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy development
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # Keep Pages deployable before the backend is available. API-backed features
          # remain unavailable until NUSGO_API_ORIGIN points to the deployed API.
          VITE_API_ORIGIN: ${{ vars.NUSGO_API_ORIGIN || 'https://api.example.invalid' }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_DATA_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the hosted build; local rehearsal output has a separate directory.
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
