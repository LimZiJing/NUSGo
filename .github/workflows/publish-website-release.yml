name: publish-website-release

on:
  workflow_run:
    workflows:
      - deploy-frontend-production
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-website-release-${{ github.event.workflow_run.display_title }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release after production success
    runs-on: ubuntu-latest
    environment: frontend-production
    steps:
      - name: Checkout trusted default-branch publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production success and publish immutable release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-website-release.mjs
